[package]
name = "fovea-io"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Image I/O codec support for fovea"
readme = "README.md"
repository = "https://github.com/karhunen-loeve/fovea-io"

[dependencies]
fovea = { version = "0.1.0", path = "../fovea" }
thiserror = "2"

# Codecs — all optional, enable via feature flags
png = { version = "0.17", optional = true }
jpeg-decoder = { version = "0.3", optional = true }
jpeg-encoder = { version = "0.6", optional = true }

[features]
default = []
bmp = []  # Pure Rust — no codec crate needed
jpeg = ["jpeg-decoder", "jpeg-encoder"]
all-codecs = ["png", "jpeg", "bmp"]
